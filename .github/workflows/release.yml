name: Release

on:
  workflow_call:
    inputs:
      publish-tag:
        required: true
        type: string
    secrets:
      TAGGER_GITHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish-tag:
        description: git tag to apply to the release commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write     # Required for OIDC token exchange (Trusted Publishing)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enforce the build-script policy
        run: python3 .github/scripts/check_build_scripts.py

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate release tag
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          set -euo pipefail
          expected_tag="v$(./scripts/get_current_version.sh cargo-semver-checks)"
          if [[ "$PUBLISH_TAG" != "$expected_tag" ]]; then
            echo "Expected release tag $expected_tag, got $PUBLISH_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$PUBLISH_TAG"

      # For Trusted Publishing:
      # https://crates.io/docs/trusted-publishing
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  tag-and-make-release:
    name: Tag and create release
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.TAGGER_GITHUB_TOKEN }}

      - name: Tag the version
        env:
          GITHUB_TOKEN: ${{ secrets.TAGGER_GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          set -euo pipefail
          git tag -- "$PUBLISH_TAG"
          git push origin "refs/tags/$PUBLISH_TAG:refs/tags/$PUBLISH_TAG"

      - uses: taiki-e/create-gh-release-action@v1
        name: Create github release
        with:
          branch: main
          ref: refs/tags/${{ inputs.publish-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-binary:
    name: Run the build-binaries workflow
    needs:
      - tag-and-make-release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      publish-tag: ${{ inputs.publish-tag }}
