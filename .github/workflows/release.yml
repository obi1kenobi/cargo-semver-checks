name: Release

on:
  workflow_call:
    inputs:
      publish-tag:
        required: true
        type: string
    secrets:
      TAGGER_GITHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      publish-tag:
        description: git tag to apply to the release commit
        required: true
        type: string

permissions: {}

concurrency:
  group: release

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify-package:
    name: Verify package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce the build-script policy
        run: python3 .github/scripts/check_build_scripts.py

      - name: Install rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate release tag
        env:
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          set -euo pipefail
          expected_tag="v$(./scripts/get_current_version.sh cargo-semver-checks)"
          if [[ "$PUBLISH_TAG" != "$expected_tag" ]]; then
            echo "Expected release tag $expected_tag, got $PUBLISH_TAG" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$PUBLISH_TAG"

      - name: Verify package
        run: cargo publish --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --dry-run --locked

  # Package verification compiles the crate, so keep it outside this credentialed job.
  publish:
    name: Publish to crates.io
    needs:
      - verify-package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write     # Required for OIDC token exchange (Trusted Publishing)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      # For Trusted Publishing:
      # https://crates.io/docs/trusted-publishing
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        # Cargo discovers configuration from its working directory, not from
        # --manifest-path. Run outside the checkout so repository-controlled
        # configuration cannot change the registry or credential provider while
        # the publishing token is available.
        working-directory: ${{ runner.temp }}
        run: cargo publish --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --no-verify --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  tag-and-make-release:
    name: Tag and create release
    runs-on: ubuntu-latest
    needs:
      - publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.TAGGER_GITHUB_TOKEN }}

      - name: Tag the version
        env:
          GITHUB_TOKEN: ${{ secrets.TAGGER_GITHUB_TOKEN }}
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          set -euo pipefail
          git tag -- "$PUBLISH_TAG"
          git push origin "refs/tags/$PUBLISH_TAG:refs/tags/$PUBLISH_TAG"

      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        name: Create github release
        with:
          branch: main
          ref: refs/tags/${{ inputs.publish-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-binary:
    name: Run the build-binaries workflow
    needs:
      - tag-and-make-release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/build-binaries.yml
    with:
      publish-tag: ${{ inputs.publish-tag }}
