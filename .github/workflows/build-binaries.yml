name: Build binaries

on:
  workflow_call:
    inputs:
      publish-tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish-tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: build-binaries

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-script-policy:
    name: Reject unapproved build scripts
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout the trusted build-script policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Preserve the trusted build-script policy outside the worktree
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/trusted-build-script-policy"
          mkdir "$policy_dir"
          cp -- .github/build-script-exceptions.txt "$policy_dir/"
          cp -- .github/scripts/check_build_scripts.py "$policy_dir/"

      - name: Checkout the release tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.publish-tag }}
          persist-credentials: false

      - name: Record and validate the release source
        id: source
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/trusted-build-script-policy"
          # The release tag may omit scripts approved by the current policy.
          # Allow absence only; present scripts still require an exact path and digest.
          python3 "$policy_dir/check_build_scripts.py" \
            --repository "$GITHUB_WORKSPACE" \
            --exceptions "$policy_dir/build-script-exceptions.txt" \
            --allow-missing-approved-build-scripts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-binary:
    name: Build ${{ matrix.target }}
    needs:
      - build-script-policy
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-script-policy.outputs.source_sha }}
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Build and package binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: cargo-semver-checks
          target: ${{ matrix.target }}
          ref: refs/tags/${{ inputs.publish-tag }}
          tar: all
          zip: windows
          dry-run: true
          dry-run-intended: true
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_LTO: true

      - name: Upload packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            cargo-semver-checks-${{ matrix.target }}.tar.gz
            cargo-semver-checks-${{ matrix.target }}.zip
          retention-days: 1
          if-no-files-found: error

  # This job handles release credentials but never checks out or executes repository code.
  upload-binaries:
    name: Upload binaries
    needs:
      - build-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Upload binaries to the GitHub release
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish-tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            "$ASSET_DIR"/cargo-semver-checks-*.tar.gz
            "$ASSET_DIR"/cargo-semver-checks-*.zip
          )
          if [[ "${#assets[@]}" -lt 8 ]]; then
            echo "Expected at least 8 release assets, found ${#assets[@]}" >&2
            exit 1
          fi

          for delay in {1..10}; do
            if gh release upload "$PUBLISH_TAG" "${assets[@]}" \
                --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            sleep "$delay"
          done
          gh release upload "$PUBLISH_TAG" "${assets[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
