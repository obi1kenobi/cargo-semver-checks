name: Build binaries

on:
  workflow_call:
    inputs:
      publish-tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      publish-tag:
        required: true
        type: string

permissions: {}

concurrency:
  group: build-binaries

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-script-policy:
    name: Reject unapproved build scripts
    if: >-
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout the trusted build-script policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Preserve the trusted build-script policy outside the worktree
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/trusted-build-script-policy"
          mkdir "$policy_dir"
          cp -- .github/build-script-exceptions.txt "$policy_dir/"
          cp -- .github/scripts/check_build_scripts.py "$policy_dir/"

      - name: Checkout the release tag without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.publish-tag }}
          persist-credentials: false

      - name: Record and validate the release source
        id: source
        run: |
          set -euo pipefail
          policy_dir="$RUNNER_TEMP/trusted-build-script-policy"
          # The release tag may omit scripts approved by the current policy.
          # Allow absence only; present scripts still require an exact path and digest.
          python3 "$policy_dir/check_build_scripts.py" \
            --repository "$GITHUB_WORKSPACE" \
            --exceptions "$policy_dir/build-script-exceptions.txt" \
            --allow-missing-approved-build-scripts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-upload-binary:
    name: Build ${{ matrix.target }}
    needs:
      - build-script-policy
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os || 'ubuntu-22.04' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-script-policy.outputs.source_sha }}
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: cargo-semver-checks
          target: ${{ matrix.target }}
          ref: refs/tags/${{ inputs.publish-tag }}
          tar: all
          zip: windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_LTO: true
